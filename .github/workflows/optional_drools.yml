name: "[OPTIONAL] Drools Runner"

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_pr:
        description: 'Upstream dmn-tck/tck PR number to test (leave blank to test current branch as-is)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Fetch and merge upstream PR branch (if PR number supplied)
      if: ${{ github.event.inputs.upstream_pr != '' }}
      run: |
        PR=${{ github.event.inputs.upstream_pr }}
        echo "Fetching upstream dmn-tck/tck PR #$PR"
        git remote add upstream https://github.com/dmn-tck/tck.git || true
        git fetch upstream pull/${PR}/head:upstream-pr-${PR}
        git merge --no-edit upstream-pr-${PR}
        echo "Merged upstream PR #$PR on top of current branch"

    - name: Run OPTIONAL Drools Runner
      # It is never possible to make a green PR check running tests, because new tests for new
      # features that may not be yet in the engine can get merged separately. So ignoring failures,
      # but still running tests to have a list of potential failures.
      run: cd runners && mvn verify --batch-mode --update-snapshots -Pdrools -Dmaven.test.failure.ignore=true

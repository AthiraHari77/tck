name: "BAMOE TCK Dashboard — Sync, Baseline & Refresh"

# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS WORKFLOW DOES
# ─────────────────────────────────────────────────────────────────────────────
#
# STEP 1 — Sync upstream master
#   Merges the latest dmn-tck/tck master into tck_dashboard.
#
# STEP 2 — Restore baseline CSV from cache
#   Restores TestResults/Drools/999-SNAPSHOT/tck_results.csv from the Actions
#   cache. On a cache miss (first run or expired) the file is simply absent and
#   the baseline re-run in Step 6 will produce it fresh.
#
# STEP 3 — Determine whether baseline needs a refresh
#   Compares the upstream master SHA against the SHA embedded in the cached CSV
#   path key. If master has moved (or cache missed), Drools is re-run.
#
# STEP 4 — Build Drools 999-SNAPSHOT from source (only if needed)
#   Clones apache/incubator-kie-drools and builds only the two DMN modules.
#
# STEP 5 — Refresh baseline (only if master changed or cache missed)
#   Re-runs Drools TCK against master, saves tck_results.csv, saves to cache.
#
# STEP 6 — Test ALL open upstream PRs (always, every run)
#   For each open PR: clone upstream, merge master locally, run TCK runner.
#   Results stay on the runner only — never committed to git.
#
# STEP 7 — Generate self-contained HTML dashboard (Node.js)
#   Runs generate_dashboard.js → produces docs/drools-dashboard.html with all
#   data, CSS and SVG embedded inline.
#
# STEP 8 — Commit and push dashboard HTML only
#   Only docs/drools-dashboard.html is committed — served via GitHub Pages.
#   No pr-results/, no baseline CSV, no sha file ever committed.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 1 * * 1'   # Weekly — Monday 01:00 UTC

  workflow_dispatch:
    inputs:
      upstream_pr:
        description: 'PR number, "all" for all open PRs, or blank to just refresh dashboard'
        required: false
        default: ''
      pr_title:
        description: 'Short title label (only used for a single PR number)'
        required: false
        default: ''

concurrency:
  group: tck-dashboard
  cancel-in-progress: false

jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ── 1. Checkout tck_dashboard branch ──────────────────────────────────
      - name: Checkout tck_dashboard
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DASHBOARD_PAT }}
          ref: tck_dashboard
          fetch-depth: 0

      # ── 2. Sync upstream master ────────────────────────────────────────────
      - name: Sync upstream master
        id: sync
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/dmn-tck/tck.git || true
          git fetch upstream master
          git merge upstream/master --no-edit -m "chore: sync upstream master $(date -u +%Y-%m-%d)" || true
          git push origin tck_dashboard 2>/dev/null || true

          UPSTREAM_SHA=$(git rev-parse upstream/master)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream master SHA: $UPSTREAM_SHA"

      # ── 3. Determine run mode ──────────────────────────────────────────────
      - name: Determine run mode
        id: mode
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
        run: |
          INPUT="${{ github.event.inputs.upstream_pr }}"
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "schedule" ] || [ "$INPUT" = "all" ] || [ -z "$INPUT" ]; then
            PR_LIST=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/dmn-tck/tck/pulls?state=open&per_page=50" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const a=JSON.parse(d);process.stdout.write(a.map(p=>p.number).join(' '));}catch(e){}})")
            echo "pr_list=$PR_LIST" >> "$GITHUB_OUTPUT"
            echo "should_test=$([ -n "$PR_LIST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            [ -z "$INPUT" ] && echo "trigger=refresh" >> "$GITHUB_OUTPUT" || echo "trigger=${EVENT}" >> "$GITHUB_OUTPUT"
            echo "Mode: all open PRs = '$PR_LIST'"
          else
            echo "pr_list=$INPUT"   >> "$GITHUB_OUTPUT"
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "trigger=single"   >> "$GITHUB_OUTPUT"
            echo "Mode: single PR = $INPUT"
          fi

      # ── 4. Restore baseline CSV from cache ────────────────────────────────
      - name: Restore baseline CSV from cache
        id: cache-baseline
        uses: actions/cache/restore@v4
        with:
          path: TestResults/Drools/999-SNAPSHOT/tck_results.csv
          key: baseline-drools-${{ steps.sync.outputs.upstream_sha }}
          restore-keys: baseline-drools-

      # ── 5. Set up Java 17 (only if baseline needs rebuild or PRs to test) ──
      - name: Set up JDK 17
        if: steps.cache-baseline.outputs.cache-hit != 'true' || steps.mode.outputs.should_test == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 6. Get Drools HEAD SHA (Maven cache key) ───────────────────────────
      - name: Get Drools HEAD SHA
        if: steps.cache-baseline.outputs.cache-hit != 'true' || steps.mode.outputs.should_test == 'true'
        id: drools-sha
        run: |
          SHA=$(git ls-remote https://github.com/apache/incubator-kie-drools.git HEAD \
                | cut -f1 | cut -c1-12)
          echo "sha=$SHA"        >> "$GITHUB_OUTPUT"
          echo "DROOLS_SHA=$SHA" >> "$GITHUB_ENV"

      # ── 7. Cache Maven ~/.m2 ──────────────────────────────────────────────
      - name: Cache Maven repository
        if: steps.cache-baseline.outputs.cache-hit != 'true' || steps.mode.outputs.should_test == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-drools-${{ steps.drools-sha.outputs.sha }}
          restore-keys: m2-drools-

      # ── 8. Build Drools 999-SNAPSHOT from source ───────────────────────────
      - name: Clone apache/incubator-kie-drools
        if: steps.cache-baseline.outputs.cache-hit != 'true' || steps.mode.outputs.should_test == 'true'
        run: git clone --depth 1 https://github.com/apache/incubator-kie-drools.git drools-src

      - name: Build Drools DMN modules only
        if: steps.cache-baseline.outputs.cache-hit != 'true' || steps.mode.outputs.should_test == 'true'
        working-directory: drools-src
        run: |
          mvn install \
            --batch-mode -DskipTests \
            -Dcheckstyle.skip=true -Denforcer.skip=true \
            -Dformatter.skip=true  -Dquarkus.build.skip=true \
            -pl kie-dmn/kie-dmn-api,kie-dmn/kie-dmn-core \
            -am -T 2C -q

      # ── 9. Refresh baseline (only on cache miss) ───────────────────────────
      - name: Run Drools TCK against master (refresh baseline)
        if: steps.cache-baseline.outputs.cache-hit != 'true'
        run: |
          mvn verify --batch-mode --update-snapshots \
            -Pdrools -Dmaven.test.failure.ignore=true \
            --file runners/pom.xml

      - name: Save baseline CSV to cache
        if: steps.cache-baseline.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: TestResults/Drools/999-SNAPSHOT/tck_results.csv
          key: baseline-drools-${{ steps.sync.outputs.upstream_sha }}

      # ── 10. Test each open PR (always fresh, never committed) ──────────────
      - name: Test each PR in isolated workspace
        if: steps.mode.outputs.should_test == 'true'
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
          PR_LIST: ${{ steps.mode.outputs.pr_list }}
        run: |
          for PR in $PR_LIST; do
            echo "════════════════════════════════════════════"
            echo "  Testing upstream PR #$PR (isolated)"
            echo "════════════════════════════════════════════"

            WORK_DIR="upstream-tck-pr-${PR}"
            rm -rf "$WORK_DIR"
            git clone --no-tags --single-branch --branch master \
              https://github.com/dmn-tck/tck.git "$WORK_DIR"

            cd "$WORK_DIR"
            git fetch origin pull/${PR}/head:pr-${PR} || {
              echo "WARNING: Could not fetch PR #$PR — skipping"
              cd ..; rm -rf "$WORK_DIR"; continue
            }

            git checkout pr-${PR}
            git config user.email "ci@bamoe-dashboard.local"
            git config user.name  "BAMOE CI"
            MERGE_CONFLICT=false
            MERGE_OUT=$(git merge master --no-edit --no-ff 2>&1)
            MERGE_EXIT=$?
            if echo "$MERGE_OUT" | grep -q "CONFLICT" || [ $MERGE_EXIT -ne 0 ]; then
              echo "WARNING: PR #$PR — merge conflict, testing unmerged branch"
              git merge --abort 2>/dev/null || true
              MERGE_CONFLICT=true
            fi
            cd ..

            cd "$WORK_DIR/runners"
            mvn verify --batch-mode --update-snapshots \
              -Pdrools -Dmaven.test.failure.ignore=true
            cd ../..

            RUN_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            mkdir -p pr-results/${PR}
            RESULT_CSV=$(find "${WORK_DIR}/TestResults/Drools" -name "tck_results.csv" | head -1)
            if [ -z "$RESULT_CSV" ]; then
              echo "WARNING: No tck_results.csv for PR #$PR — skipping"
              rm -rf "$WORK_DIR"; continue
            fi
            cp "$RESULT_CSV" pr-results/${PR}/tck_results.csv
            rm -rf "$WORK_DIR"

            read -r TOTAL PASS FAIL < <(node -e "
              const fs=require('fs'),lines=fs.readFileSync('pr-results/${PR}/tck_results.csv','utf8').split('\n');
              let t=0,p=0,f=0;
              for(const l of lines){if(!l.trim())continue;const r=l.split(',');if(r.length<4)continue;t++;r[3].replace(/^\"|\"$/g,'')==='SUCCESS'?p++:f++;}
              process.stdout.write(t+' '+p+' '+f);
            ")

            PR_JSON=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/dmn-tck/tck/pulls/${PR}")

            TITLE=$(echo "$PR_JSON" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const o=JSON.parse(d);process.stdout.write(o.title||'');}catch(e){}})" \
              2>/dev/null || echo "PR #${PR}")
            PR_HEAD_SHA=$(echo "$PR_JSON" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const o=JSON.parse(d);process.stdout.write((o.head||{}).sha||'');}catch(e){}})" \
              2>/dev/null || echo "")

            BEHIND_BY=0; SYNC_STATUS="unknown"
            if [ -n "$PR_HEAD_SHA" ]; then
              COMPARE_JSON=$(curl -s \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/dmn-tck/tck/compare/master...${PR_HEAD_SHA}")
              BEHIND_BY=$(echo "$COMPARE_JSON" \
                | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const o=JSON.parse(d);process.stdout.write(String(o.behind_by||0));}catch(e){process.stdout.write('0');}})" \
                2>/dev/null || echo "0")
              SYNC_STATUS=$(echo "$COMPARE_JSON" \
                | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const o=JSON.parse(d);process.stdout.write(o.status||'unknown');}catch(e){process.stdout.write('unknown');}})" \
                2>/dev/null || echo "unknown")
            fi

            TESTED_AS_SYNCED=true
            [ "$MERGE_CONFLICT" = "true" ] && TESTED_AS_SYNCED=false

            cat > pr-results/${PR}/meta.json << EOF
          {
            "pr_number": $PR,
            "pr_title": "$TITLE",
            "run_date": "$RUN_DATE",
            "drools_sha": "$DROOLS_SHA",
            "head_sha": "$PR_HEAD_SHA",
            "total": $TOTAL,
            "pass": $PASS,
            "fail": $FAIL,
            "behind_by": $BEHIND_BY,
            "sync_status": "$SYNC_STATUS",
            "tested_as_synced": $TESTED_AS_SYNCED,
            "merge_conflict": $MERGE_CONFLICT
          }
          EOF
            echo "PR #$PR — $PASS passed / $FAIL failed / $TOTAL total"
            # Results stay on the runner only — never committed to git
          done

      # ── 11. Generate self-contained HTML dashboard ─────────────────────────
      - name: Generate dashboard HTML
        env:
          GITHUB_TOKEN: ${{ secrets.DASHBOARD_PAT }}
        run: |
          node scripts/generate_dashboard.js \
            --pr-results-dir pr-results \
            --baseline-csv   TestResults/Drools/999-SNAPSHOT/tck_results.csv \
            --upstream-repo  dmn-tck/tck \
            --token          "$GITHUB_TOKEN" \
            --output         docs/drools-dashboard.html

      # ── 12. Commit and push dashboard HTML (GitHub Pages) ──────────────────
      - name: Commit and push dashboard HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/drools-dashboard.html
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "dashboard: ${{ steps.mode.outputs.trigger }} @ $(date -u +%Y-%m-%d)"
          git pull --rebase origin tck_dashboard
          git push origin tck_dashboard

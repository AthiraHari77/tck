name: "BAMOE TCK Dashboard — Sync, Baseline & Refresh"

# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS WORKFLOW DOES (in order, every weekly run)
# ─────────────────────────────────────────────────────────────────────────────
#
# STEP 1 — Sync upstream master
#   Merges the latest dmn-tck/tck master into tck_dashboard so our test cases
#   and runners are always up to date.
#
# STEP 2 — Refresh baseline (only if master moved)
#   Re-runs Drools 999-SNAPSHOT against the freshly synced master and commits
#   the updated tck_results.csv as the new baseline. This ensures the dashboard
#   correctly separates "already failing on master" from "introduced by this PR".
#
# STEP 3 — Test open upstream PRs
#   For each open PR on dmn-tck/tck: clones upstream, locally merges master
#   (ephemeral, never pushed), runs the TCK runner, saves results. Skips PRs
#   whose head SHA hasn't changed since the last run.
#
# STEP 4 — Regenerate dashboard (always)
#   Runs generate_dashboard.py to produce docs/drools-dashboard.html and
#   commits + pushes everything back to tck_dashboard.
#
# WHY NOT on:pull_request?
#   GitHub's pull_request event only fires for PRs opened against THIS repo.
#   The upstream dmn-tck/tck is a completely separate repository — there is no
#   native GitHub event that fires here when someone opens a PR there.
#   Weekly scheduled polling is the correct solution.
#
# MANUAL TRIGGER (workflow_dispatch)
#   - specific PR number  → skip sync/baseline, test that PR only
#   - "all"               → skip sync/baseline, test all currently open PRs
#   - blank               → skip sync/baseline/testing, just refresh dashboard
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Weekly on Monday at 01:00 UTC
  schedule:
    - cron: '0 1 * * 1'

  # Manual trigger with optional mode selection
  workflow_dispatch:
    inputs:
      upstream_pr:
        description: 'PR number (e.g. 717), "all" for all open PRs, or blank to just refresh dashboard'
        required: false
        default: ''
      pr_title:
        description: 'Short title label (only used for a single PR number)'
        required: false
        default: ''

# ─────────────────────────────────────────────────────────────────────────────
# CONCURRENCY — only one run active at a time; queue rather than cancel so
# a queued run doesn't lose a 30-minute Drools build.
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: tck-dashboard
  cancel-in-progress: false

jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ── 1. Checkout tck_dashboard branch ────────────────────────────────────
      - name: Checkout tck_dashboard
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.DASHBOARD_PAT }}
          ref: tck_dashboard
          fetch-depth: 0

      # ── 2. Sync upstream master (schedule + manual dispatch) ────────────────
      - name: Sync upstream master
        id: sync
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/dmn-tck/tck.git || true
          git fetch upstream master

          BEFORE=$(git rev-parse HEAD)
          git merge upstream/master --no-edit -m "chore: sync upstream master $(date -u +%Y-%m-%d)"
          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "master_changed=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits — skipping baseline refresh."
          else
            echo "master_changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream master moved ($BEFORE → $AFTER) — baseline refresh needed."
            git push origin tck_dashboard
          fi

      # ── 3. Determine run mode ────────────────────────────────────────────────
      - name: Determine run mode
        id: mode
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
        run: |
          INPUT="${{ github.event.inputs.upstream_pr }}"
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "schedule" ]; then
            # Weekly schedule: discover all open upstream PRs, skip unchanged ones.
            echo "trigger=schedule" >> "$GITHUB_OUTPUT"

            PR_LIST=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/dmn-tck/tck/pulls?state=open&per_page=50" \
              | python3 -c "import sys,json; prs=json.load(sys.stdin); print(' '.join(str(p['number']) for p in prs))")

            NEW_PRS=""
            for PR in $PR_LIST; do
              if [ ! -f "pr-results/${PR}/meta.json" ]; then
                NEW_PRS="$NEW_PRS $PR"
              else
                LIVE_SHA=$(curl -s \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/dmn-tck/tck/pulls/${PR}" \
                  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('head',{}).get('sha',''))" \
                  2>/dev/null || echo "")
                STORED_SHA=$(python3 -c "import sys,json; d=json.load(open('pr-results/${PR}/meta.json')); print(d.get('head_sha',''))" \
                  2>/dev/null || echo "")
                if [ -n "$LIVE_SHA" ] && [ "$LIVE_SHA" != "$STORED_SHA" ]; then
                  echo "PR #$PR head SHA changed ($STORED_SHA → $LIVE_SHA) — re-testing"
                  NEW_PRS="$NEW_PRS $PR"
                fi
              fi
            done
            NEW_PRS=$(echo $NEW_PRS | xargs)
            echo "pr_list=$NEW_PRS" >> "$GITHUB_OUTPUT"
            echo "should_test=$([ -n "$NEW_PRS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "Schedule mode: PRs to test (new or updated) = '$NEW_PRS'"

          elif [ -n "$INPUT" ] && [ "$INPUT" != "all" ]; then
            # Manual: single PR number
            echo "trigger=single" >> "$GITHUB_OUTPUT"
            echo "pr_list=$INPUT"  >> "$GITHUB_OUTPUT"
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "Manual mode: single PR = $INPUT"

          elif [ "$INPUT" = "all" ]; then
            # Manual: all open PRs
            PR_LIST=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/dmn-tck/tck/pulls?state=open&per_page=50" \
              | python3 -c "import sys,json; prs=json.load(sys.stdin); print(' '.join(str(p['number']) for p in prs))")
            echo "trigger=all" >> "$GITHUB_OUTPUT"
            echo "pr_list=$PR_LIST" >> "$GITHUB_OUTPUT"
            echo "should_test=$([ -n "$PR_LIST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "Manual mode: all open PRs = '$PR_LIST'"

          else
            # Manual: blank input → dashboard refresh only
            echo "trigger=refresh" >> "$GITHUB_OUTPUT"
            echo "pr_list=" >> "$GITHUB_OUTPUT"
            echo "should_test=false" >> "$GITHUB_OUTPUT"
            echo "Manual mode: dashboard refresh only"
          fi

      # ── 4. Set up Java 17 (needed for both baseline refresh and PR testing) ──
      - name: Set up JDK 17
        if: steps.mode.outputs.should_test == 'true' || steps.sync.outputs.master_changed == 'true'
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Get Drools HEAD SHA for Maven cache key ───────────────────────────
      - name: Get Drools HEAD SHA
        if: steps.mode.outputs.should_test == 'true' || steps.sync.outputs.master_changed == 'true'
        id: drools-sha
        run: |
          SHA=$(git ls-remote https://github.com/apache/incubator-kie-drools.git HEAD \
                | cut -f1 | cut -c1-12)
          echo "sha=$SHA"          >> "$GITHUB_OUTPUT"
          echo "DROOLS_SHA=$SHA"   >> "$GITHUB_ENV"

      # ── 6. Cache Maven ~/.m2 ────────────────────────────────────────────────
      - name: Cache Maven repository
        if: steps.mode.outputs.should_test == 'true' || steps.sync.outputs.master_changed == 'true'
        uses: actions/cache@v4.2.3
        with:
          path: ~/.m2/repository
          key: m2-drools-${{ steps.drools-sha.outputs.sha }}
          restore-keys: m2-drools-

      # ── 7. Build Drools 999-SNAPSHOT from source ────────────────────────────
      #
      # Build only the DMN module subtree — the full repo requires Kogito
      # artifacts that aren't available in CI.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Clone apache/incubator-kie-drools
        if: steps.mode.outputs.should_test == 'true' || steps.sync.outputs.master_changed == 'true'
        run: git clone --depth 1 https://github.com/apache/incubator-kie-drools.git drools-src

      - name: Build Drools DMN modules only (kie-dmn-api + kie-dmn-core)
        if: steps.mode.outputs.should_test == 'true' || steps.sync.outputs.master_changed == 'true'
        working-directory: drools-src
        run: |
          mvn install \
            --batch-mode \
            -DskipTests \
            -Dcheckstyle.skip=true \
            -Denforcer.skip=true \
            -Dformatter.skip=true \
            -Dquarkus.build.skip=true \
            -pl kie-dmn/kie-dmn-api,kie-dmn/kie-dmn-core \
            -am \
            -T 2C \
            -q

      # ── 8. Refresh baseline against fresh master (only when master changed) ──
      #
      # Re-runs Drools TCK against the current master checkout so the baseline
      # CSV always reflects what master actually fails — not a stale snapshot.
      # This means PR failure counts are always compared against the real
      # current master state, not the state from weeks/months ago.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Run Drools TCK against master (refresh baseline)
        if: steps.sync.outputs.master_changed == 'true'
        run: |
          mvn verify \
            --batch-mode \
            --update-snapshots \
            -Pdrools \
            -Dmaven.test.failure.ignore=true \
            --file runners/pom.xml

      - name: Commit updated baseline CSV
        if: steps.sync.outputs.master_changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RESULT_CSV=$(find TestResults/Drools -name "tck_results.csv" | head -1)
          if [ -z "$RESULT_CSV" ]; then
            echo "WARNING: No tck_results.csv produced — baseline not updated."
          else
            cp "$RESULT_CSV" TestResults/Drools/999-SNAPSHOT/tck_results.csv
            git add TestResults/Drools/999-SNAPSHOT/tck_results.csv
            git diff --cached --quiet && echo "Baseline unchanged." || \
              git commit -m "baseline: refresh after upstream master sync $(date -u +%Y-%m-%d)"
            git push origin tck_dashboard
          fi

      # ── 9. Test each open PR in an isolated workspace ────────────────────────
      #
      # For each PR we:
      #   a) Clone upstream tck into a temp dir
      #   b) Fetch the PR's head ref
      #   c) Check out the PR branch and locally merge master (ephemeral — never pushed)
      #      This gives the "post-sync" view without touching the author's branch.
      #   d) Run the TCK runner inside the temp clone
      #   e) Copy only the results CSV back — discard the temp clone
      # ─────────────────────────────────────────────────────────────────────────
      - name: Test each PR in isolated workspace
        if: steps.mode.outputs.should_test == 'true'
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
          PR_LIST: ${{ steps.mode.outputs.pr_list }}
        run: |
          for PR in $PR_LIST; do
            echo "════════════════════════════════════════════"
            echo "  Testing upstream PR #$PR (isolated)"
            echo "════════════════════════════════════════════"

            # ── a) Clone upstream tck ────────────────────────────────────────
            WORK_DIR="upstream-tck-pr-${PR}"
            rm -rf "$WORK_DIR"
            git clone --no-tags --single-branch --branch master \
              https://github.com/dmn-tck/tck.git "$WORK_DIR"

            # ── b) Fetch the PR's head ref ───────────────────────────────────
            cd "$WORK_DIR"
            git fetch origin pull/${PR}/head:pr-${PR} || {
              echo "WARNING: Could not fetch PR #$PR — skipping"
              cd ..
              rm -rf "$WORK_DIR"
              continue
            }

            # ── c) Checkout PR branch and locally merge master ───────────────
            git checkout pr-${PR}
            git config user.email "ci@bamoe-dashboard.local"
            git config user.name  "BAMOE CI"
            MERGE_CONFLICT=false
            MERGE_OUT=$(git merge master --no-edit --no-ff 2>&1)
            MERGE_EXIT=$?
            if echo "$MERGE_OUT" | grep -q "CONFLICT" || [ $MERGE_EXIT -ne 0 ]; then
              echo "WARNING: PR #$PR — merge failed (exit=$MERGE_EXIT); testing unmerged branch"
              echo "$MERGE_OUT"
              git merge --abort 2>/dev/null || true
              MERGE_CONFLICT=true
            else
              echo "PR #$PR — local merge of master succeeded (ephemeral, never pushed)"
            fi
            cd ..

            # ── d) Run TCK runner inside the temp clone ──────────────────────
            cd "$WORK_DIR/runners"
            mvn verify \
              --batch-mode \
              --update-snapshots \
              -Pdrools \
              -Dmaven.test.failure.ignore=true
            cd ../..

            # ── e) Copy results back, discard temp clone ─────────────────────
            RUN_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            mkdir -p pr-results/${PR}
            RESULT_CSV=$(find "${WORK_DIR}/TestResults/Drools" -name "tck_results.csv" | head -1)

            if [ -z "$RESULT_CSV" ]; then
              echo "WARNING: No tck_results.csv found for PR #$PR — skipping"
              rm -rf "$WORK_DIR"
              continue
            fi

            cp "$RESULT_CSV" pr-results/${PR}/tck_results.csv
            rm -rf "$WORK_DIR"

            read -r TOTAL PASS FAIL < <(python3 scripts/count_csv.py "pr-results/${PR}/tck_results.csv")

            PR_JSON=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/dmn-tck/tck/pulls/${PR}")

            TITLE=$(echo "$PR_JSON" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('title',''))" \
              2>/dev/null || echo "PR #${PR}")

            PR_HEAD_SHA=$(echo "$PR_JSON" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('head',{}).get('sha',''))" \
              2>/dev/null || echo "")
            PR_BASE_SHA=$(echo "$PR_JSON" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('base',{}).get('sha',''))" \
              2>/dev/null || echo "")

            BEHIND_BY=0
            SYNC_STATUS="unknown"
            if [ -n "$PR_HEAD_SHA" ] && [ -n "$PR_BASE_SHA" ]; then
              COMPARE_JSON=$(curl -s \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/dmn-tck/tck/compare/master...${PR_HEAD_SHA}")
              BEHIND_BY=$(echo "$COMPARE_JSON" \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('behind_by', 0))" \
                2>/dev/null || echo "0")
              SYNC_STATUS=$(echo "$COMPARE_JSON" \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" \
                2>/dev/null || echo "unknown")
            fi

            echo "PR #${PR} sync status: $SYNC_STATUS (behind_by=$BEHIND_BY)"

            TESTED_AS_SYNCED=true
            if [ "$MERGE_CONFLICT" = "true" ]; then
              TESTED_AS_SYNCED=false
            fi
            cat > pr-results/${PR}/meta.json << EOF
          {
            "pr_number": $PR,
            "pr_title": "$TITLE",
            "run_date": "$RUN_DATE",
            "drools_sha": "$DROOLS_SHA",
            "head_sha": "$PR_HEAD_SHA",
            "total": $TOTAL,
            "pass": $PASS,
            "fail": $FAIL,
            "behind_by": $BEHIND_BY,
            "sync_status": "$SYNC_STATUS",
            "tested_as_synced": $TESTED_AS_SYNCED,
            "merge_conflict": $MERGE_CONFLICT
          }
          EOF
            echo "PR #$PR — $PASS passed / $FAIL failed / $TOTAL total"

            # ── f) Commit results for this PR immediately ────────────────────
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pr-results/${PR}/
            git diff --cached --quiet && true || \
              git commit -m "dashboard: results for PR #${PR} @ $(date -u +%Y-%m-%d)"
            PUSH_OK=false
            for attempt in 1 2 3; do
              if git push origin tck_dashboard; then
                PUSH_OK=true
                break
              fi
              echo "Push attempt $attempt failed — rebasing and retrying"
              if ! git pull --rebase origin tck_dashboard; then
                git rebase --abort 2>/dev/null || true
                echo "## ❌ Push failed for PR #${PR}" >> "$GITHUB_STEP_SUMMARY"
                echo "Rebase conflict on attempt ${attempt}. Results for PR #${PR} and any subsequent PRs in this run were NOT persisted." >> "$GITHUB_STEP_SUMMARY"
                echo "Re-run this workflow manually to retry." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            done
            if [ "$PUSH_OK" = "false" ]; then
              echo "## ❌ Push failed for PR #${PR} after 3 attempts" >> "$GITHUB_STEP_SUMMARY"
              echo "All 3 push attempts were rejected. Results for PR #${PR} and any subsequent PRs in this run were NOT persisted." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

      # ── 10. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      # ── 11. Regenerate dashboard (ALWAYS runs regardless of trigger) ─────────
      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.DASHBOARD_PAT }}
        run: |
          python3 scripts/generate_dashboard.py \
            --pr-results-dir pr-results \
            --baseline-csv   TestResults/Drools/999-SNAPSHOT/tck_results.csv \
            --upstream-repo  dmn-tck/tck \
            --token          "$GITHUB_TOKEN" \
            --output         docs/drools-dashboard.html

      # ── 12. Commit and push dashboard ────────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d pr-results ] && git add pr-results/ || true
          git add docs/drools-dashboard.html
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "dashboard: ${{ steps.mode.outputs.trigger }} @ $(date -u +%Y-%m-%d)"
          git push origin tck_dashboard
